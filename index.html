<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LUXE STORE — Home</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <header class="navbar">
    <div class="nav-container">
      <a class="logo" href="index.html">LUXE<span>STORE</span></a>
      <nav class="nav-links">
        <a href="index.html" class="active">Home</a>
        <a href="cart.html">Cart <span class="cart-badge" id="cartCount">0</span></a>
      </nav>
    </div>
  </header>

  <!-- ===== HERO ===== -->
  <section class="hero">
    <div class="hero-content">
      <p class="hero-sub">New Collection 2026</p>
      <h1>Elevate Your<br /><span>Everyday Style</span></h1>
      <p class="hero-desc">Discover curated pieces that blend minimalism with modern elegance.</p>
      <a href="#products" class="btn-primary">Shop Now</a>
    </div>
    <div class="hero-visual">
      <div class="hero-card">
        <div class="hero-img-placeholder">
          <svg width="140" height="140" viewBox="0 0 140 140" fill="none">
            <rect width="140" height="140" rx="70" fill="#f5f5f5"/>
            <rect x="40" y="50" width="60" height="55" rx="8" fill="#e8e8e8"/>
            <rect x="50" y="38" width="40" height="20" rx="6" fill="#d8d8d8"/>
            <circle cx="58" cy="80" r="5" fill="#c8c8c8"/>
            <circle cx="82" cy="80" r="5" fill="#c8c8c8"/>
          </svg>
        </div>
        <div class="hero-badge">⭐ 4.9 Rating</div>
      </div>
    </div>
  </section>

  <!-- ===== CATEGORIES ===== -->
  <section class="categories">
    <div class="container">
      <div class="category-list">
        <button class="cat-btn active" data-filter="all">All</button>
        <button class="cat-btn" data-filter="tops">Tops</button>
        <button class="cat-btn" data-filter="bottoms">Bottoms</button>
        <button class="cat-btn" data-filter="accessories">Accessories</button>
      </div>
    </div>
  </section>

  <!-- ===== PRODUCTS ===== -->
  <section class="products" id="products">
    <div class="container">
      <h2 class="section-title">Featured Products</h2>
      <div class="product-grid" id="productGrid"></div>
    </div>
  </section>

  <!-- ===== TOAST ===== -->
  <div class="toast" id="toast">Item added to cart! 🛒</div>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <p>© 2026 LUXESTORE. All rights reserved.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
